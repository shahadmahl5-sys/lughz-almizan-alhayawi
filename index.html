<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e6b4c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>لغز الميزان الحيوي — كتاب تفاعلي</title>
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/fonts.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body data-theme="intro" class="is-cover">
  <div id="app">
    <header class="topbar">
      <div class="brand">
        <span class="logo" id="logo" aria-hidden="true"></span>
        <div><h1>لغز الميزان الحيوي</h1><div class="chap" id="chap"></div></div>
      </div>
      <nav class="tools" aria-label="أدوات الكتاب">
        <button class="tbtn" id="bMap" title="خريطة المحمية" aria-label="خريطة المحمية"></button>
        <button class="tbtn" id="bFile" title="ملف الفريق" aria-label="ملف الفريق"><span class="badge" id="fileCount" style="display:none">0</span></button>
        <button class="tbtn" id="bSound" title="الصوت" aria-label="الصوت"></button>
        <button class="tbtn" id="bFull" title="ملء الشاشة" aria-label="ملء الشاشة"></button>
        <button class="tbtn" id="bRestart" title="إعادة الرحلة" aria-label="إعادة الرحلة من البداية"></button>
      </nav>
      <div class="progress" id="prog"><i></i></div>
    </header>

    <main id="book" aria-live="polite"></main>

    <footer class="navbar">
      <button class="nbtn" id="prev" aria-label="الصفحة السابقة"><span>السابق</span></button>
      <div class="navinfo" id="navinfo"></div>
      <button class="nbtn primary" id="next" aria-label="التالي"><span>التالي</span></button>
    </footer>
  </div>

  <div class="modal" id="modal" hidden></div>
  <div class="toast" id="toast" role="status"></div>

  <noscript><p style="padding:20px;font-family:sans-serif">يحتاج الكتاب إلى تفعيل JavaScript في المتصفح.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/art.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
